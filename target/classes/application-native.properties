# Native Image Configuration
quarkus.package.type=native
quarkus.native.container-build=false
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-17

# Memory optimization for native image
quarkus.native.native-image-xmx=4g
quarkus.native.additional-build-args=-H:+ReportExceptionStackTraces,-H:Name=sklearn-model-validator

# Reduce footprint
quarkus.native.enable-reports=false
quarkus.native.auto-inject-tracing=false

# Runtime initialization
quarkus.native.runtime-cmd=-Djava.util.logging.manager=org.jboss.logmanager.LogManager
