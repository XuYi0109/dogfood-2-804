# Application Configuration
quarkus.application.name=sklearn-model-validator
quarkus.http.port=8080

# Model Configuration
model.path=${MODEL_PATH:models}
model.default=${MODEL_DEFAULT:model.joblib}
model.type=${MODEL_TYPE:joblib}

# Python Configuration
python.home=${PYTHON_HOME:}
python.path=${PYTHON_PATH:}

# Health Check Configuration
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.liveness-path=/live
quarkus.smallrye-health.readiness-path=/ready

# Metrics Configuration
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.micrometer.enabled=true

# Logging Configuration
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."com.mlops".level=DEBUG

# Native Image Configuration
quarkus.native.additional-build-args=-H:+ReportExceptionStackTraces,--initialize-at-run-time=org.python.core.PySystemState
quarkus.native.resources.includes=models/**,scripts/**

# CORS Configuration (for CICD testing)
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Dev Mode Configuration
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
%dev.quarkus.log.level=DEBUG
