name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        cd scripts
        pip install -r requirements.txt

    - name: Generate ONNX model
      run: |
        cd scripts
        python train_model.py

    - name: Build and Test
      run: ./mvnw clean verify -B

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/

  build-native:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '17'
        distribution: 'graalvm-community'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        cd scripts
        pip install -r requirements.txt

    - name: Generate ONNX model
      run: |
        cd scripts
        python train_model.py

    - name: Build Native Image
      run: ./mvnw package -Dnative -B

    - name: Upload native binary
      uses: actions/upload-artifact@v4
      with:
        name: native-binary
        path: target/*-runner

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        cd scripts
        pip install -r requirements.txt

    - name: Generate ONNX model
      run: |
        cd scripts
        python train_model.py

    - name: Build JVM package
      run: ./mvnw package -DskipTests -B

    - name: Build Docker image (JVM)
      run: docker build -f src/main/docker/Dockerfile.jvm -t sklearn-model-service:jvm .

    - name: Test Docker image
      run: |
        docker run -d -p 8080:8080 --name test-container sklearn-model-service:jvm
        sleep 30
        curl -f http://localhost:8080/q/health || exit 1
        curl -f http://localhost:8080/api/model/status || exit 1
        docker stop test-container
        docker rm test-container
