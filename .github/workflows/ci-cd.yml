name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: ./mvnw clean compile -B

    - name: Run Unit Tests
      run: ./mvnw test -B

    - name: Run Integration Tests
      run: ./mvnw verify -B

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/

    - name: Package Application
      run: ./mvnw package -DskipTests -B

    - name: Upload JVM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jvm-artifact
        path: target/quarkus-app/

  native-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '17'
        distribution: 'mandrel'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Native Image
      run: ./mvnw package -Dnative -DskipTests -B

    - name: Upload Native Artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-artifact
        path: target/*-runner

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build JVM Docker Image
      run: |
        docker build --target jvm -t sklearn-model-validator:jvm .

    - name: Test JVM Docker Image
      run: |
        docker run -d -p 8080:8080 --name test-jvm sklearn-model-validator:jvm
        sleep 10
        curl -f http://localhost:8080/health/ready || exit 1
        curl -f http://localhost:8080/api/v1/models || exit 1
        docker stop test-jvm

  model-validation:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Application
      run: ./mvnw package -DskipTests -B

    - name: Start Application
      run: |
        java -jar target/quarkus-app/quarkus-run.jar &
        sleep 15

    - name: Run Model Validation Tests
      run: |
        # Health check
        curl -f http://localhost:8080/health/ready || exit 1

        # List models
        curl -f http://localhost:8080/api/v1/models || exit 1

        # Validate mock model
        curl -f -X POST http://localhost:8080/api/v1/models/mock-model/validate || exit 1

        # Test prediction
        curl -f -X POST http://localhost:8080/api/v1/models/mock-model/predict \
          -H "Content-Type: application/json" \
          -d '{"data":[{"feature1":1.0,"feature2":2.0,"feature3":3.0}]}' || exit 1

        # Validate all models
        curl -f -X POST http://localhost:8080/api/v1/models/validate-all || exit 1

        echo "All model validation tests passed!"

    - name: Stop Application
      run: |
        pkill -f quarkus-run.jar || true
