stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

image: maven:3.9-eclipse-temurin-17

cache:
  paths:
    - .m2/repository

build:
  stage: build
  script:
    - mvn compile package -DskipTests
  artifacts:
    paths:
      - target/quarkus-app/

test:
  stage: test
  script:
    - mvn test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
